    <!-- ── PRODUCT DETAIL MODAL (AJOUT AU PANIER SANS FORMULAIRE PERSONNEL) ── -->
    <div x-show="isProductModalOpen" x-cloak @keydown.escape.window="isProductModalOpen = false"
        class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm overflow-y-auto"
        x-transition:enter="transition ease-out duration-150" x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100">

        <div @click.away="isProductModalOpen = false"
            class="bg-card-bg card-border w-full max-w-lg p-5 sm:p-6 space-y-4 relative shadow-2xl my-8 max-h-[90vh] overflow-y-auto">

            <button @click="isProductModalOpen = false"
                class="absolute top-3 right-3 w-7 h-7 bg-white pill-border font-black text-xs hover:bg-slate-900 hover:text-white transition-colors flex items-center justify-center z-10 cursor-pointer"
                title="Fermer">
                ✕
            </button>

            <template x-if="activeProduct">
                <div class="space-y-4">
                    <!-- Image Box -->
                    <div class="relative bg-card-bg card-border p-4 h-64 sm:h-72 flex items-center justify-center overflow-hidden">
                        <img :src="(currentImageIndex === 1 && activeProduct.image_url_2 ? activeProduct.image_url_2 : activeProduct.image) || 'https://placehold.co/400x400/f6f3eb/111827?text=Image+Produit'" :alt="activeProduct.name"
                            @click.stop="openLightbox(activeProduct.image, activeProduct.image_url_2, currentImageIndex)"
                            class="w-full h-full object-contain p-2 rounded-md drop-shadow-md cursor-zoom-in hover:scale-105 transition-transform duration-200"
                            @error="$event.target.src='https://placehold.co/400x400/f6f3eb/111827?text=Image+Produit'">
                        <button x-show="activeProduct.image_url_2" x-cloak type="button"
                            @click="currentImageIndex = currentImageIndex === 0 ? 1 : 0"
                            class="absolute bottom-3 right-3 px-3 py-1.5 bg-white/90 pill-border text-[10px] font-black uppercase text-slate-900 hover:bg-slate-900 hover:text-white transition-colors">
                            Changer l’image
                        </button>
                    </div>

                    <template x-if="activeProduct.detail_table_image">
                        <button @click="openLightbox(activeProduct.detail_table_image)"
                                class="inline-flex items-center gap-2 px-3.5 py-2 mt-3 text-xs font-extrabold text-slate-800 bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-xl transition-colors">
                            <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                            </svg>
                            <span>Guide des tailles & formats</span>
                        </button>
                    </template>

                    <!-- Product Info -->
                    <div class="space-y-2">
                        <div class="flex items-center justify-between gap-3">
                            <h2 class="min-w-0 break-words text-xl sm:text-2xl font-black uppercase tracking-tight text-slate-900"
                                x-text="activeProduct.name"></h2>
                            <div class="text-right shrink-0">
                                <p class="text-xs font-semibold text-slate-600">
                                    Prix maximum :
                                    <span :class="{ 'line-through': Number(activeProduct.current_price) < Number(activeProduct.max_price) }"
                                        x-text="formatPrice(activeProduct.max_price)"></span>
                                </p>
                                <p class="text-lg sm:text-xl font-black text-emerald-800">
                                    Prix actuel :
                                    <span x-text="formatPrice(activeProduct.current_price)"></span>
                                </p>
                            </div>
                        </div>

                        <p class="break-words text-xs sm:text-sm text-slate-700 font-semibold leading-relaxed"
                            x-text="activeProduct.description"></p>
                    </div>

                    <!-- Options d'ajout : Taille & Quantité -->
                    <div class="p-4 bg-white card-border space-y-3">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <!-- Choix de la taille -->
                            <div class="space-y-1">
                                <label class="block text-[11px] font-black uppercase text-slate-700">Taille :</label>
                                <select x-model="selectedTaille"
                                    class="w-full px-3 py-2 text-xs font-black bg-white pill-border focus:outline-none focus:ring-2 focus:ring-slate-900 cursor-pointer">
                                    <template x-for="size in activeProduct.sizes" :key="size">
                                        <option :value="size" x-text="size"></option>
                                    </template>
                                </select>
                            </div>

                            <template x-if="Number(activeProduct.requires_customization) === 1 && Number(activeProduct.allow_no_customization) === 1">
                                <label class="sm:col-span-2 flex items-start gap-2.5 text-xs font-semibold text-slate-700 cursor-pointer">
                                    <input type="checkbox" x-model="noCustomization"
                                        class="mt-0.5 w-4 h-4 rounded border-2 border-slate-900 text-slate-900 focus:ring-0 cursor-pointer">
                                    <span>Ne pas personnaliser cet article (prénom/nom)</span>
                                </label>
                            </template>

                            <!-- Choix de la quantité -->
                            <div class="space-y-1">
                                <label class="block text-[11px] font-black uppercase text-slate-700">Quantité (1-10) :</label>
                                <input type="number" min="1" max="10" x-model.number="selectedQuantite"
                                    class="w-full px-3 py-2 text-xs font-black bg-white pill-border focus:outline-none focus:ring-2 focus:ring-slate-900">
                            </div>
                        </div>

                        <!-- Feedback visuel après ajout -->
                        <div x-show="justAddedFeedback" x-cloak
                             x-transition:enter="transition ease-out duration-200 transform"
                             x-transition:enter-start="opacity-0 scale-95"
                             x-transition:enter-end="opacity-100 scale-100"
                             class="p-2.5 bg-emerald-100 border-2 border-emerald-900 rounded font-black text-xs text-emerald-950 flex items-center justify-between">
                            <span class="flex items-center gap-1.5">
                                <span>✓</span>
                                <span>Ajouté à votre précommande !</span>
                            </span>
                            <button @click="isProductModalOpen = false; openCartModal()"
                                    class="underline font-black uppercase text-[11px] hover:text-emerald-800 cursor-pointer">
                                Voir le panier →
                            </button>
                        </div>
                    </div>

                    <!-- Action : Ajouter au panier / Bloqué si prix null OU Précommandes fermées -->
                    <div class="pt-1">
                        <template x-if="preorderStatus.ouvert">
                            <div class="space-y-2">
                                <button @click="addToCart(activeProduct)"
                                    :disabled="activeProduct.price === null"
                                    :class="activeProduct.price === null ? 'bg-slate-300 text-slate-500 cursor-not-allowed border-slate-400' : 'bg-slate-900 text-white hover:bg-slate-800 active:scale-[0.99] cursor-pointer shadow-md'"
                                    class="w-full py-3.5 font-black text-xs sm:text-sm uppercase pill-border transition-all flex items-center justify-center gap-2">
                                    <span x-text="activeProduct.price === null ? '🚫' : '🛒'"></span>
                                    <span x-text="activeProduct.price === null ? 'PRIX NON DISPONIBLE' : 'AJOUTER À MA PRÉCOMMANDE'"></span>
                                </button>
                                <div class="text-center pt-1" x-show="cartCount > 0 && activeProduct.price !== null">
                                    <button @click="isProductModalOpen = false; openCartModal()"
                                            class="text-xs font-black text-slate-800 underline hover:text-sky-700 uppercase cursor-pointer">
                                        Voir ma précommande (<span x-text="cartCount"></span> article<span x-show="cartCount > 1">s</span>) →
                                    </button>
                                </div>
                            </div>
                        </template>

                        <template x-if="!preorderStatus.ouvert">
                            <div class="p-4 bg-slate-200 border-2 border-slate-900 rounded text-center space-y-1">
                                <p class="font-black text-xs sm:text-sm uppercase text-slate-800 flex items-center justify-center gap-2">
                                    <span>🔒</span> PRÉCOMMANDES FERMÉES
                                </p>
                                <p class="text-[11px] font-semibold text-slate-600"
                                   x-text="preorderStatus.message || 'Les précommandes sont actuellement terminées.'"></p>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </div>
