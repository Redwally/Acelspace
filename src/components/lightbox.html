    <!-- ── LIGHTBOX (APERÇU GRAND FORMAT) ─────────────────────────────────── -->
    <div x-show="lightboxOpen" x-cloak @keydown.escape.window="closeLightbox()" @click.self="closeLightbox()"
        class="fixed inset-0 z-[100] bg-black/80 flex items-center justify-center p-2 sm:p-4 overflow-y-auto"
        x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100" role="dialog" aria-modal="true" aria-label="Aperçu de l’image produit">
        <button @click="closeLightbox()" type="button" aria-label="Fermer l’aperçu"
            class="absolute top-4 right-4 sm:top-6 sm:right-6 w-10 h-10 rounded-full bg-white/90 text-slate-900 text-2xl font-black hover:bg-white transition-colors">
            ✕
        </button>
        <img :src="(currentLightboxIndex === 1 && lightboxImage2 ? lightboxImage2 : lightboxImage) || 'https://placehold.co/600x600/f6f3eb/111827?text=Image+Produit'"
            alt="Image produit en grand format" @click.stop
            class="max-h-[90vh] max-w-full w-full object-contain rounded-lg shadow-2xl">
        <button x-show="lightboxImage2" x-cloak @click="toggleLightboxImage()" type="button"
            class="absolute bottom-5 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full bg-white/90 text-slate-900 text-xs font-black uppercase hover:bg-white transition-colors">
            Changer la vue
        </button>
    </div>
